workflows:
  # Simulator .app only
  ios-debug:
    name: GestaltX iOS (simulator debug)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "GestaltX.xcodeproj"
        XCODE_SCHEME: "GestaltX"
    scripts:
      - name: Build simulator app
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  # Unsigned IPA for sideload tools (TrollStore etc.) — no Apple cert needed
  ios-unsigned-ipa:
    name: GestaltX unsigned IPA
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "GestaltX.xcodeproj"
        XCODE_SCHEME: "GestaltX"
        APP_NAME: "GestaltX"
    scripts:
      - name: Build device app (no signing)
        script: |
          set -euo pipefail
          mkdir -p build/unsigned
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

          APP_PATH=$(find build/DerivedData/Build/Products -name "${APP_NAME}.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ${APP_NAME}.app not found"
            find build/DerivedData -name "*.app" -type d || true
            exit 1
          fi
          echo "Found app: $APP_PATH"

          # Package as IPA (Payload + zip)
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          rm -f "${APP_NAME}-unsigned.ipa"
          zip -r "${APP_NAME}-unsigned.ipa" Payload
          ls -lh "${APP_NAME}-unsigned.ipa"
          mkdir -p ios/ipa
          cp "${APP_NAME}-unsigned.ipa" ios/ipa/
    artifacts:
      - build/*-unsigned.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # Signed IPA — needs cert + profile in Codemagic UI
  ios-ipa:
    name: GestaltX signed IPA
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.huami.gestultx
      vars:
        XCODE_PROJECT: "GestaltX.xcodeproj"
        XCODE_SCHEME: "GestaltX"
        BUNDLE_ID: "com.huami.gestultx"
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
