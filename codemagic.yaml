workflows:
  # Simulator .app only — not an IPA. Useful for compile checks.
  ios-debug:
    name: GestaltX iOS (simulator debug)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "GestaltX.xcodeproj"
        XCODE_SCHEME: "GestaltX"
        BUNDLE_ID: "com.huami.gestultx"
    scripts:
      - name: Build simulator app
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  # Real device IPA — requires code signing in Codemagic UI.
  ios-ipa:
    name: GestaltX iOS (signed IPA)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      # REQUIRED in Codemagic UI:
      # 1. Team / Application → Code signing identities → upload certificate + profile
      # 2. Profile must include App Group for MobileGestalt access
      # 3. Match distribution_type below to your profile type
      ios_signing:
        distribution_type: ad_hoc   # or: development | app_store | enterprise
        bundle_identifier: com.huami.gestultx
      vars:
        XCODE_PROJECT: "GestaltX.xcodeproj"
        XCODE_SCHEME: "GestaltX"
        BUNDLE_ID: "com.huami.gestultx"
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          # ad_hoc → IOS_APP_ADHOC
          # development → IOS_APP_DEVELOPMENT
          # app_store → IOS_APP_STORE
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
